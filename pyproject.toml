[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-to-skills"
version = "0.1.0"
description = "Manage MCP server lifecycles from skills"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mcp-to-skills = "mcp_to_skills.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
